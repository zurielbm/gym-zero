# Gym Zero — full production stack in one compose file.
#   app           static frontend (nginx), built with the sync server URL baked in
#   backend       self-hosted Convex (the durable copy of personal data)
#   dashboard     Convex web dashboard (optional to expose)
#   convex-deploy one-shot job that pushes app/convex/ functions on every (re)deploy
#
# Copy .env.example to .env (or set the same vars in Dokploy) first.
#
# First boot only: the backend must exist before an admin key can be minted.
#   1. deploy with CONVEX_SELF_HOSTED_ADMIN_KEY left empty (convex-deploy skips)
#   2. docker compose exec backend ./generate_admin_key.sh
#   3. put the key in .env and redeploy — functions then deploy automatically

services:
  app:
    build:
      context: ./app
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - convex-data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-gym-tracker}
      - INSTANCE_SECRET
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${CONVEX_PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${CONVEX_SITE_PROXY_PORT:-3211}}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
    restart: unless-stopped

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${CONVEX_PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  convex-deploy:
    build:
      context: ./app
      dockerfile: Dockerfile.convex-deploy
    environment:
      - CONVEX_SELF_HOSTED_URL=http://backend:3210
      - CONVEX_SELF_HOSTED_ADMIN_KEY
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

volumes:
  convex-data:
